# HxRouter Docker Compose
# Usage:
#   1. cp .env.example .env && nano .env
#   2. docker compose up -d
#   3. Open http://localhost:20128

services:
  hxrouter:
    image: ghcr.io/huathy/hxrouter:latest
    container_name: hxrouter
    restart: unless-stopped
    ports:
      - "${PORT:-20128}:20128"
    volumes:
      - 9router-data:/app/data
      # Compatibility sources for pre-v1.0.0 named-volume installs.
      # Bind-mount users must keep their existing host path or migrate it first.
      # The entrypoint copies only missing files into the canonical volume.
      - hxrouter-data:/migration-data:ro
      - vansrouter-data:/migration-vansdata:ro
      # Optional: use the host's Tailscale daemon instead of the bundled one.
      # Uncomment the line below and set TAILSCALE_USE_HOST_SOCKET=true in .env
      # - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Set TAILSCALE_USE_HOST_SOCKET=true to reuse the host Tailscale daemon.
      # TAILSCALE_USE_HOST_SOCKET: "true"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:20128/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  9router-data:
    name: 9router-data
  hxrouter-data:
    name: hxrouter-data
  vansrouter-data:
    name: vansrouter-data
