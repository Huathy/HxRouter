name: Release

on:
  push:
    tags:
      - "v*"
  # Manual entry point for environments where `push` events do not reach the
  # runner. It runs the exact same gates as a tag push; the tag is supplied as
  # an input and is still validated by check-branch (tag == origin/$RELEASE_BRANCH).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish, e.g. v1.0.1"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/huathy/hxrouter
  # The tag must point at the current tip of this branch. `main` stays the
  # integration branch; releases are cut from `master`.
  RELEASE_BRANCH: master
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  check-branch:
    runs-on: ubuntu-latest
    outputs:
      is-release-branch: ${{ steps.check.outputs.is-release-branch }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Verify tag/commit is on the release branch
        id: check
        run: |
          git fetch origin "$RELEASE_BRANCH"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/release-validation"
          if test "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$RELEASE_BRANCH")"; then
            echo "is-release-branch=true" >> "$GITHUB_OUTPUT"
            echo "✅ Release target is the current $RELEASE_BRANCH commit"
          else
            echo "is-release-branch=false" >> "$GITHUB_OUTPUT"
            echo "⛔ Release blocked: tag must point to the current $RELEASE_BRANCH commit"
            exit 1
          fi

          RELEASE_TAG_REF=refs/tags/release-validation node cli/scripts/validate-release.cjs "$RELEASE_TAG"

  build-and-verify-ghcr:
    needs: check-branch
    if: needs.check-branch.outputs.is-release-branch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.GHCR_IMAGE }}:release-${{ github.run_id }}-${{ github.run_attempt }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max,ignore-error=true,timeout=5m
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      - name: Verify multi-platform manifest
        run: |
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:release-${{ github.run_id }}-${{ github.run_attempt }}" | tee /tmp/image-manifest.txt
          grep -q 'linux/amd64' /tmp/image-manifest.txt
          grep -q 'linux/arm64' /tmp/image-manifest.txt

      - name: Verify native SQLite in image
        run: |
          docker pull "${{ env.GHCR_IMAGE }}:release-${{ github.run_id }}-${{ github.run_attempt }}"
          docker run --rm "${{ env.GHCR_IMAGE }}:release-${{ github.run_id }}-${{ github.run_attempt }}" \
            node -e "const D=require('better-sqlite3'); const db=new D(':memory:'); if (db.prepare('SELECT 1 AS ok').get().ok !== 1) process.exit(1); db.close(); console.log('native SQLite OK')"

  package-npm:
    needs: check-branch
    if: needs.check-branch.outputs.is-release-branch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Configure pnpm hoisting config
        shell: bash
        run: |
          echo "public-hoist-pattern=*" >> .npmrc
          echo "shamefully-hoist=true" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install CLI package dependencies
        # cli/ is outside the pnpm workspace; use its tracked lockfile for reproducible packaging.
        run: npm ci --prefix cli --ignore-scripts --no-audit --no-fund

      - name: Build and pack CLI package
        id: pack
        run: |
          npm run build --prefix cli
          npm pack ./cli --pack-destination "$RUNNER_TEMP"
          printf 'tarball=%s\n' "$RUNNER_TEMP/huathy-hxrouter-${{ needs.check-branch.outputs.version }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Validate final CLI tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_VERSION: ${{ needs.check-branch.outputs.version }}
        run: node cli/scripts/validate-package.cjs "$TARBALL" "$RELEASE_VERSION"

      - name: Smoke-test extracted CLI artifact without network
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          RELEASE_VERSION: ${{ needs.check-branch.outputs.version }}
        run: node cli/scripts/smoke-package.cjs "$TARBALL" "$RELEASE_VERSION"

      - name: Upload validated CLI tarball
        uses: actions/upload-artifact@v4
        with:
          name: cli-package-${{ needs.check-branch.outputs.version }}
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  promote-ghcr:
    needs: [check-branch, build-and-verify-ghcr]
    if: needs.check-branch.outputs.is-release-branch == 'true' && needs.build-and-verify-ghcr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified image
        env:
          STAGING_IMAGE: ${{ env.GHCR_IMAGE }}:release-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_IMAGE: ${{ env.GHCR_IMAGE }}:${{ needs.check-branch.outputs.version }}
          LATEST_IMAGE: ${{ env.GHCR_IMAGE }}:latest
        run: |
          docker buildx imagetools create --tag "$RELEASE_IMAGE" "$STAGING_IMAGE"
          docker buildx imagetools create --tag "$LATEST_IMAGE" "$STAGING_IMAGE"

  # Second distribution channel: the same verified staging image, promoted to
  # Docker Hub. The namespace is the DOCKERHUB_USERNAME secret, so the image is
  # docker.io/<dockerhub user>/hxrouter.
  promote-dockerhub:
    needs: [check-branch, build-and-verify-ghcr]
    if: needs.check-branch.outputs.is-release-branch == 'true' && needs.build-and-verify-ghcr.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote verified image
        env:
          STAGING_IMAGE: ${{ env.GHCR_IMAGE }}:release-${{ github.run_id }}-${{ github.run_attempt }}
          DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/hxrouter
          RELEASE_VERSION: ${{ needs.check-branch.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$DOCKERHUB_IMAGE" && test "$DOCKERHUB_IMAGE" != "docker.io//hxrouter"
          docker buildx imagetools create --tag "$DOCKERHUB_IMAGE:$RELEASE_VERSION" "$STAGING_IMAGE"
          docker buildx imagetools create --tag "$DOCKERHUB_IMAGE:latest" "$STAGING_IMAGE"

      - name: Verify published Docker Hub manifest
        env:
          DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/hxrouter
          RELEASE_VERSION: ${{ needs.check-branch.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$RELEASE_VERSION" | tee /tmp/dockerhub-manifest.txt
          grep -q 'linux/amd64' /tmp/dockerhub-manifest.txt
          grep -q 'linux/arm64' /tmp/dockerhub-manifest.txt
          echo "docker hub: $DOCKERHUB_IMAGE:$RELEASE_VERSION (amd64 + arm64)"

  # The staging tag is the recovery anchor when a promotion fails (see
  # .agent/cicd.md: promote or recover the exact staging image, never rebuild), so
  # it is only dropped once every registry is serving the release. Runs last.
  cleanup-staging:
    needs: [check-branch, promote-ghcr, promote-dockerhub]
    if: >-
      needs.check-branch.outputs.is-release-branch == 'true' &&
      needs.promote-ghcr.result == 'success' &&
      needs.promote-dockerhub.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove the staging tag
        env:
          STAGING_IMAGE: ${{ env.GHCR_IMAGE }}:release-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          if docker buildx imagetools rm "$STAGING_IMAGE" 2>/dev/null; then
            echo "removed staging tag $STAGING_IMAGE"
          else
            echo "::notice::staging tag $STAGING_IMAGE was already gone"
          fi

  # Runs last: the GitHub Release (and therefore the generated contributors list)
  # must not exist before both published artifacts are live in the registries.
  create-github-release:
    needs: [check-branch, package-npm, promote-ghcr, promote-dockerhub]
    if: needs.check-branch.outputs.is-release-branch == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated CLI tarball
        uses: actions/download-artifact@v4
        with:
          name: cli-package-${{ needs.check-branch.outputs.version }}
          path: ${{ runner.temp }}/cli-package

      - name: Verify both published artifacts
        env:
          RELEASE_VERSION: ${{ needs.check-branch.outputs.version }}
          DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/hxrouter
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/cli-package/huathy-hxrouter-$RELEASE_VERSION.tgz"
          node cli/scripts/validate-package.cjs "$tarball" "$RELEASE_VERSION"
          docker buildx imagetools inspect "$GHCR_IMAGE:$RELEASE_VERSION" | tee /tmp/release-manifest.txt
          grep -q 'linux/amd64' /tmp/release-manifest.txt
          grep -q 'linux/arm64' /tmp/release-manifest.txt
          echo "ghcr: $GHCR_IMAGE:$RELEASE_VERSION (amd64 + arm64)"
          docker buildx imagetools inspect "$DOCKERHUB_IMAGE:$RELEASE_VERSION" | tee /tmp/dockerhub-release-manifest.txt
          grep -q 'linux/amd64' /tmp/dockerhub-release-manifest.txt
          grep -q 'linux/arm64' /tmp/dockerhub-release-manifest.txt
          echo "docker hub: $DOCKERHUB_IMAGE:$RELEASE_VERSION (amd64 + arm64)"

      - name: Build install section
        env:
          RELEASE_VERSION: ${{ needs.check-branch.outputs.version }}
          DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_USERNAME }}/hxrouter
        run: |
          cat > /tmp/install.md <<'EOF'

          ---

          ## 安装 / Install

          本次发布产出：GHCR 镜像 + Docker Hub 镜像 + GitHub Release 附件（CLI 安装包）。

          ### Docker (GHCR)

          ```bash
          docker pull ghcr.io/huathy/hxrouter:__VERSION__
          docker pull ghcr.io/huathy/hxrouter:latest

          docker run -d --name hxrouter -p 20128:20128 \
            -v 9router-data:/app/data \
            -e DATA_DIR=/app/data \
            ghcr.io/huathy/hxrouter:__VERSION__
          ```

          ### Docker (Docker Hub)

          ```bash
          docker pull __DOCKERHUB__:__VERSION__
          docker pull __DOCKERHUB__:latest

          docker run -d --name hxrouter -p 20128:20128 \
            -v 9router-data:/app/data \
            -e DATA_DIR=/app/data \
            __DOCKERHUB__:__VERSION__
          ```

          或使用仓库根目录的 `docker-compose.yml`：`docker compose up -d`

          ### CLI（GitHub Release 附件，无需 npm 账号）

          ```bash
          npm install -g https://github.com/__REPO__/releases/download/__TAG__/huathy-hxrouter-__VERSION__.tgz
          hxrouter
          ```

          校验完整性（可选，sha256 为该 Release 附件页面显示的值）：

          ```bash
          curl -fsSL -o huathy-hxrouter-__VERSION__.tgz \\
            https://github.com/__REPO__/releases/download/__TAG__/huathy-hxrouter-__VERSION__.tgz
          sha256sum huathy-hxrouter-__VERSION__.tgz
          ```

          Dashboard: http://localhost:20128
          EOF
          sed -i "s/__VERSION__/$RELEASE_VERSION/g" /tmp/install.md
          sed -i "s|__DOCKERHUB__|$DOCKERHUB_IMAGE|g" /tmp/install.md
          sed -i "s|__REPO__|$GITHUB_REPOSITORY|g" /tmp/install.md
          sed -i "s|__TAG__|$RELEASE_TAG|g" /tmp/install.md
          test "$(grep -c '__VERSION__' /tmp/install.md)" = "0"
          test "$(grep -c '__DOCKERHUB__' /tmp/install.md)" = "0"
          test "$(grep -c '__REPO__' /tmp/install.md)" = "0"
          test "$(grep -c '__TAG__' /tmp/install.md)" = "0"

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            echo "::notice::GitHub release $TAG already exists; leaving the existing notes untouched"
            exit 0
          fi
          if gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$(git rev-parse HEAD)" \
              --jq .body > /tmp/notes.md 2>/tmp/notes-error.txt; then
            test -s /tmp/notes.md
            cat /tmp/install.md >> /tmp/notes.md
          else
            echo "::warning::generate-notes API failed, falling back to gh --generate-notes"
            cat /tmp/notes-error.txt
            gh release create "$TAG" --generate-notes --verify-tag --title "$TAG"
            exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md
          gh release view "$TAG" --json url,tagName --jq '"Created \(.tagName): \(.url)"'

      - name: Attach the CLI tarball to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.check-branch.outputs.version }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          TARBALL="$RUNNER_TEMP/cli-package/huathy-hxrouter-$RELEASE_VERSION.tgz"
          test -f "$TARBALL"

          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "huathy-hxrouter-$RELEASE_VERSION.tgz"; then
            echo "::notice::huathy-hxrouter-$RELEASE_VERSION.tgz is already attached to $TAG"
            exit 0
          fi

          # A release that already exists (for example a re-run after a failed
          # promotion) still needs the asset, so upload instead of skipping.
          if ! gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file /tmp/notes.md
          fi

          gh release upload "$TAG" "$TARBALL" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size) bytes \(.url)"'
          echo "::notice::install with: npm install -g https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/huathy-hxrouter-$RELEASE_VERSION.tgz"
